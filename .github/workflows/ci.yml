name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  local-pipeline:
    name: Local pipeline and quality checks (DuckDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/download_data.py
      - run: python pipeline/load_raw.py
      - run: python pipeline/build_silver.py
      - run: python pipeline/build_gold.py
      - run: python pipeline/check_quality.py

  dbt:
    name: dbt project compiles
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ci.azuredatabricks.net
      DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/ci
      ARM_CLIENT_ID: ci
      ARM_CLIENT_SECRET: ci
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/profiles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r dbt/requirements.txt
      - run: dbt parse
        working-directory: dbt

  terraform:
    name: Terraform is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
