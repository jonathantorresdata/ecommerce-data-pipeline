name: ecommerce_pipeline
version: "1.0.0"
config-version: 2
profile: ecommerce

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Live-store replay: the original order history is shifted so that this original
  # date falls on the store opening day. Orders before it form the historical
  # backfill; later orders "arrive" one day at a time as real time passes.
  replay_original_start: "2018-03-01"
  replay_store_opening: "2026-11-06"
  # Optional fixed point in time (e.g. "2027-01-31 23:59:59") to rebuild the store
  # as it was on that day. Empty means "now".
  as_of: ""

models:
  ecommerce_pipeline:
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
